<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Was bleibt nach dem Löschen?</title>
  <meta name="description" content="Aus einer Chat-Nachricht entstehen Kopien. Löschen erreicht nur die Kopien, die einen Löschpfad haben. Regeln und Messungen aus memory-lab.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400..700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <main>
    <header class="head">
      <p class="kicker">Memory Lab</p>
      <h1>Was bleibt nach dem Löschen?</h1>
    </header>

    <section class="copies" id="kopien" aria-labelledby="copies-title">
      <h2 id="copies-title" class="sr">Eine Nachricht und ihre Kopien</h2>
      <p class="message" id="message"></p>
      <p class="fan" id="fan"></p>
      <ul class="copy-list" id="copy-list"></ul>
      <p class="takeaway" id="takeaway"></p>
    </section>

    <section class="grid-box" aria-labelledby="grid-title">
      <h2 id="grid-title">Was der Klick auf „Chat löschen“ erreicht</h2>
      <p class="intro" id="grid-intro"></p>
      <div class="grid" id="grid" role="table" aria-labelledby="grid-title"></div>
      <h3 class="cases-title">Alle Fälle</h3>
      <div class="table-scroll" tabindex="0" role="region" aria-label="Alle Fälle">
        <table id="cases"></table>
      </div>
    </section>

    <section class="rates" aria-labelledby="rates-title">
      <h2 id="rates-title">Wie oft entstehen solche Kopien?</h2>
      <div class="rate" id="rate-memory"></div>
      <div class="rate" id="rate-log"></div>
    </section>

    <footer class="foot">
      <p id="limits"></p>
      <nav class="links" aria-label="Weiterlesen">
        <a href="https://github.com/rubenvitt/memory-lab/blob/main/docs/findings.md">Befunde</a>
        <a href="https://github.com/rubenvitt/memory-lab/tree/main/data">Rohdaten</a>
        <a href="https://github.com/rubenvitt/memory-lab/blob/main/prompts/e3/README.md">Regeln des Versuchs</a>
        <a href="https://rubeen.dev/blog/memory-datenarchitektur/">Blogpost</a>
      </nav>
    </footer>
  </main>
</body>
</html>
